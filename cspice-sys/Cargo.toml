[package]
name = "cspice-rs-sys"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Unsafe bindings to the NAIF CSPICE toolkit"
license = "LGPL-3.0"
authors = ["Jacob Halsey <jacob@jhalsey.com>", "cislunarspace"]
homepage = "https://github.com/cislunarspace/cspice-rs/tree/main/cspice-sys"
repository = "https://github.com/cislunarspace/cspice-rs"
rust-version = "1.77"

[features]
downloadcspice = ["dep:reqwest"]

[dependencies]

[build-dependencies]
# 关闭 bindgen 默认 feature 中的 prettyplease：其 0.3 起绑定 syn 3，而
# 依赖图中已有 syn 2 的调用方（如 pyo3）会让 resolver 把 bindgen 复用到
# syn 2，产生混合链接（bindgen#3267 类问题）；本 crate 显式使用
# Formatter::Rustfmt，prettyplease 本就多余。runtime 为 bindgen 运行必需。
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }
reqwest = { version = "0.12", features = ["blocking"], optional = true }
