name: release-plz

# push main 触发：依 conventional commit 生成/更新版本 PR（含 changelog）。
# CARGO_REGISTRY_TOKEN secret 就绪后，版本 PR 合并即自动发布到 crates.io；
# 首个 0.1.0 为手动发布（见 docs/adr/0001）。

on:
  push:
    branches: [main]

jobs:
  release-plz:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-cspice
        with:
          naif-package: PC_Linux_GCC_64bit
          naif-ext: tar.Z
          fallback-asset: cspice-linux.zip
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: CSPICE_DIR
      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
