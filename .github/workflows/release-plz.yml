name: release-plz

# release-plz：依 conventional commit 生成/更新版本 PR（含 changelog）。
# 触发说明：手动触发（workflow_dispatch）。自动触发需两个前置条件就绪后改回
# push main：
# 1. org 设置 "Allow GitHub Actions to create and approve pull requests" 开启
#    （当前 gh token 无 admin:org 权限，需 org 管理员在 UI 开启）；
# 2. CARGO_REGISTRY_TOKEN secret 配置（首版 0.1.0 手动发布，见 ADR 0001）。
on:
  workflow_dispatch:

jobs:
  release-plz:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-cspice
        with:
          naif-package: PC_Linux_GCC_64bit
          naif-ext: tar.Z
          fallback-asset: cspice-linux.zip
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: CSPICE_DIR
      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
