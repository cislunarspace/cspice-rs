version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # 仅安全相关与 minor/patch；bindgen 等 build 依赖升级需人工验证
    # CSPICE_DIR / CSPICE_CLANG_TARGET 契约（见 cspice-sys/build.rs）。
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
